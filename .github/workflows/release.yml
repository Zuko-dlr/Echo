# Publie une version d'Écho : compile sur un Mac de GitHub, fabrique l'archive et crée la release.
# Lancement à la main (onglet Actions → « Publier une version » → Run workflow).
name: Publier une version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26   # Xcode récent : mêmes bibliothèques que sur un Mac à jour
    steps:
      - uses: actions/checkout@v4

      - name: Compiler Echo.app, fabriquer l'archive et la somme de contrôle
        id: pack
        run: |
          ./release.sh
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=Echo-${version}-macOS-arm64.zip" >> "$GITHUB_OUTPUT"

      - name: Créer la release sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.pack.outputs.version }}"
          case "$v" in *.*.*) ;; *) v="$v.0" ;; esac   # 1.3 → 1.3.0 ; 1.3.1 reste 1.3.1
          tag="v$v"
          notes="docs/RELEASE-$v.md"
          [ -f "$notes" ] || { printf '## Echo %s\n' "$v" > /tmp/notes.md; notes=/tmp/notes.md; }
          # somme de contrôle écrite dans le texte de la release, comme pour la 1.0
          sum=$(cut -d' ' -f1 "dist/${{ steps.pack.outputs.zip }}.sha256")
          sed "s|see the attached \`.*\.sha256\` file|\`$sum\`|" "$notes" > /tmp/notes-final.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file /tmp/notes-final.md
          else
            gh release create "$tag" dist/* --title "Echo $v" --notes-file /tmp/notes-final.md --target "$GITHUB_SHA"
          fi
          echo "Release $tag publiée : https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"
